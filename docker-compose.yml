services:
  mmllm:
    build: .
    ports:
      - "8000:8000"
    environment:
      MMLLM_DEVICE: cpu
      MMLLM_CONFIG: /app/configs/model.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
